components:
  schemas:
    models.UpdateFilterRequest:
      properties:
        body:
          allOf:
          - $ref: '#/components/schemas/datastore.M'
          description: Body matching criteria (optional)
        event_type:
          description: Type of event this filter applies to (optional)
          type: string
        headers:
          allOf:
          - $ref: '#/components/schemas/datastore.M'
          description: Header matching criteria (optional)
        is_flattened:
          description: Whether the filter uses flattened JSON paths (optional)
          type: boolean
      type: object
    util.ServerResponse:
      properties:
        message:
          type: string
        status:
          type: boolean
      type: object
    models.TestFilterRequest:
      properties:
        payload:
          description: Sample payload to test against the filter (required)
      required:
      - payload
      type: object
    handlers.Stub:
      type: object
    datastore.M:
      additionalProperties: true
      type: object
    models.CreateFilterRequest:
      properties:
        body:
          allOf:
          - $ref: '#/components/schemas/datastore.M'
          description: Body matching criteria (optional)
        event_type:
          description: Type of event this filter applies to (required)
          type: string
        headers:
          allOf:
          - $ref: '#/components/schemas/datastore.M'
          description: Header matching criteria (optional)
      required:
      - event_type
      type: object
    models.TestFilterResponse:
      properties:
        is_match:
          description: Whether the payload matches the filter criteria
          type: boolean
      type: object
    models.BulkUpdateFilterRequest:
      properties:
        body:
          additionalProperties: true
          type: object
        event_type:
          type: string
        headers:
          additionalProperties: true
          type: object
        uid:
          type: string
      required:
      - uid
      type: object
    models.FilterResponse:
      properties:
        body:
          $ref: '#/components/schemas/datastore.M'
        event_type:
          type: string
        headers:
          $ref: '#/components/schemas/datastore.M'
        raw_body:
          $ref: '#/components/schemas/datastore.M'
        raw_headers:
          $ref: '#/components/schemas/datastore.M'
        subscription_id:
          type: string
        uid:
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
