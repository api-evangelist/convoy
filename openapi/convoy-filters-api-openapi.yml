      - ApiKeyAuth: []
      tags:
      - Filters
      description: This endpoint creates a new filter for a subscription
      operationId: CreateFilter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/models.CreateFilterRequest'
        description: Filter to create
        required: true
